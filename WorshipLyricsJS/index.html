<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>WORSHIPLYRICSWEB</title>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <header class="text-center mt-4">
        <h1>WORDS OF WISDOM JS</h1>
        <p>PPT Worship Lyrics Website</p>
    </header>
<main class="py-4">

  <!-- Top Controls -->
  <div class="container mb-4">
    <div class="row align-items-center">

      <!-- Search Section -->
      <div class="col-12 col-md-8">
        <label class="form-label fw-bold text-white shadowed">Search Lyrics:</label>
        <input type="text" class="form-control" placeholder="Search here...">
      </div>

      <!-- Sort Section -->
      <div class="col-12 col-md-4 mt-3 mt-md-0">
        <label class="form-label fw-bold text-white shadowed">Sort By:</label>
        <select class="form-select">
          <option>Newest</option>
          <option>Oldest</option>
          <option>A-Z</option>
        </select>
      </div>

    </div>
  </div>

  <!-- Grid Section -->
  <div class="container">
    <div id="songShelf" class="row g-4">

      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card p-3 text-black">
          <p class="title mb-0 fw-bold">Title of the Song</p>
                    <hr class="m-0 ">
          <p class="descr mb-2 text-muted">Description</p>
        <a href=""> 
            <img class=""  src="/lyricsimg/iwgb_img.svg" alt="song-image">
       </a>
           <a href="coldnight.com" class=" text-center m-2 fw-bold">Song Presentation Link</a>
        </div>
      </div>
      

    </div>
  </div>

</main>
 <footer class="text-center fst-italic fw-bold">
        <p>This is built w/ HTML, BOOTSTRAP, CSS, and Javascript only.</p>
        <p>101.Projects</p>
    </footer>
</body>
<script src="script.js"></script>
</html>
